<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRIANIAC AI</title>

  <style>
    .brand-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 20px;
    }

    .brand-icon {
      width: 65px;
      height: 65px;
      border: 3px solid #00cfff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #123d70, #050b20);
      box-shadow: 0 0 15px #00cfff, inset 0 0 15px #007bff;
      animation: logoGlow 2s infinite alternate;
    }

    .brand-icon span {
      color: #00eaff;
      font-size: 38px;
      font-weight: bold;
      text-shadow: 0 0 12px #00cfff;
    }

    .brand-name {
      color: white;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 2px;
      text-shadow: 0 0 12px #008cff;
    }

    .ai-text {
      color: #00eaff;
    }

    .brand-name small {
      display: block;
      font-size: 9px;
      letter-spacing: 2px;
      color: #9bcfff;
      margin-top: 5px;
    }

    @keyframes logoGlow {
      from {
        box-shadow: 0 0 10px #00cfff;
      }
      to {
        box-shadow: 0 0 25px #00cfff;
      }
    }

    :root {
      --blue: #36cfff;
      --bg: #050816;
      --panel: #101a32;
      --text: #f4f8ff;
      --muted: #aab8d3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(
        circle at 50% 25%,
        #14264a 0%,
        var(--bg) 55%
      );
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255,255,255,.09);
    }

    .brand {
      color: var(--blue);
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 2px;
      text-shadow: 0 0 12px var(--blue);
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand-logo">
      <div class="brand-icon">
        <span>B</span>
      </div>

      <div class="brand-name">
        <span>BRIANIAC</span> <span class="ai-text">AI</span>
        <small>ASK • LEARN • INNOVATE • GROW</small>
      </div>
    </div>

    <div class="brand" id="brand">BRIANIAC AI</div>

    <button class="menu-button" id="menuToggle"
      type="button"
      aria-expanded="false"
      aria-controls="menu">
      ☰ Menu
    </button>
  </header>

  <nav class="menu" id="menu" aria-label="Main menu">
    <button type="button" data-screen="home">Home</button>
    <button type="button" data-screen="chat">Chat</button>
    <button type="button" data-screen="memory">Memory</button>
    <button type="button" data-screen="personalise">Personalise</button>
    <button type="button" data-screen="settings">Settings</button>
  </nav>

  <main>
    <!-- rest of your page -->
  </main>
</body>
</html>
