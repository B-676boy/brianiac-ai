<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRIANIAC AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle, #10294c, #030711 75%);
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

h1 {
  color: #55eaff;
  text-shadow: 0 0 15px #00bfff;
  letter-spacing: 2px;
}

.character {
  width: 230px;
  height: 230px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 25%, #5dfaff, #0874db 45%, #041b58 80%);
  border: 4px solid #55eaff;
  box-shadow: 0 0 25px #00cfff, inset 0 0 25px #8dfaff;
  position: relative;
  animation: float 3s ease-in-out infinite;
}

.eyes {
  display: flex;
  justify-content: center;
  gap: 35px;
  position: absolute;
  top: 65px;
  width: 100%;
}

.eye {
  width: 43px;
  height: 54px;
  background: white;
  border-radius: 50%;
  position: relative;
  box-shadow: 0 0 12px #aafaff;
}

.eye::after {
  content: "";
  position: absolute;
  width: 23px;
  height: 30px;
  background: #06152c;
  border-radius: 50%;
  left: 10px;
  top: 13px;
}

.eye::before {
  content: "";
  position: absolute;
  width: 9px;
  height: 9px;
  background: white;
  border-radius: 50%;
  left: 13px;
  top: 17px;
  z-index: 1;
}

.mouth {
  width: 65px;
  height: 30px;
  background: #07152c;
  border-radius: 8px 8px 35px 35px;
  border-bottom: 6px solid #ff6b9d;
  position: absolute;
  bottom: 52px;
  left: 50%;
  transform: translateX(-50%);
}

.arm {
  position: absolute;
  top: 125px;
  width: 48px;
  height: 13px;
  background: #55eaff;
  border-radius: 20px;
  box-shadow: 0 0 10px #00cfff;
}

.left-arm {
  left: -43px;
  transform: rotate(-25deg);
}

.right-arm {
  right: -43px;
  transform: rotate(25deg);
}

.hello {
  margin-top: 35px;
  font-size: 18px;
  text-align: center;
  color: #d5faff;
}

button {
  margin-top: 18px;
  padding: 12px 24px;
  border: 1px solid #55eaff;
  border-radius: 25px;
  background: #082e54;
  color: white;
  font-size: 16px;
}

button:active {
  background: #075c91;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}
</style>
</head>

<body>
<h1>BRIANIAC AI</h1>

<div class="character" aria-label="BRIANIAC AI smiling character">
  <div class="eyes">
    <div class="eye"></div>
    <div class="eye"></div>
  </div>

  <div class="mouth"></div>
  <div class="arm left-arm"></div>
  <div class="arm right-arm"></div>
</div>

<div class="hello" id="message">
  Hello! I'm BRIANIAC AI. 👋
</div>

<button id="helloButton">Say Hello!</button>

<script>
const messages = [
  "Hello! I'm BRIANIAC AI. 👋",
  "It's nice to meet you! 😊",
  "I'm ready to learn and grow! 🧠",
  "Let's build something amazing! 🚀"
];

let messageIndex = 0;

document.getElementById("helloButton").addEventListener("click", function() {
  messageIndex = (messageIndex + 1) % messages.length;
  document.getElementById("message").textContent = messages[messageIndex];
});
</script>
</body>
  </html>
